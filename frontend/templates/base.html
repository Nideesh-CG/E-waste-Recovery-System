<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="csrf-token" content="{{ csrf }}">
    <title>Circular · E-Waste Intelligence</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script defer src="{{ url_for('static', filename='interactions.js') }}"></script>
  </head>
  <body>
    {{ content }}
    <div id="toast" role="status" class="fixed bottom-6 left-1/2 z-50 flex -translate-x-1/2 items-center gap-3 rounded-xl bg-[#163e2c] px-5 py-4 text-sm text-white shadow-xl" hidden>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m8 12 3 3 5-6"/></svg>
      <span id="toast-message"></span>
      <button type="button" aria-label="Dismiss" data-dismiss-toast><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m18 6-12 12M6 6l12 12"/></svg></button>
    </div>
    {% for message in get_flashed_messages() %}
      <span hidden data-flash="{{ message }}"></span>
    {% endfor %}
  </body>
</html>
