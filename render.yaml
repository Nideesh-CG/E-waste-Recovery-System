services:
  - type: web
    name: circular-ewaste-recovery
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && flask db upgrade && gunicorn --workers 2 --threads 4 --timeout 60 --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.10
      - key: IS_PRODUCTION
        value: "true"
      - key: CIRCULAR_SECRET_KEY
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: CIRCULAR_API_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: circular-postgres
          property: connectionString
      - key: UPLOAD_STORAGE_PATH
        value: "/var/data/uploads"
      - key: PARTNER_API_URL
        sync: false
      - key: PARTNER_API_KEY
        sync: false
      - key: SEED_DEMO_DATA
        value: "false"
    disk:
      name: ewaste-data
      mountPath: /var/data
      sizeGB: 1

databases:
  - name: circular-postgres
    databaseName: circular_ewaste
    user: circular_user
    plan: free
